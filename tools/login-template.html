<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kalle Nutivaara</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1d2330; --muted:#5f6878; --accent:#0b5cad; --err:#c0392b; --border:#d9dde3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --card:#1c2029; --text:#e8eaee; --muted:#9aa3b2; --border:#333a46; --err:#ff6b5b; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text); font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:28px; }
  .logo { display:block; width:44px; height:auto; margin-bottom:16px; }
  h1 { margin:0 0 4px; font-size:22px; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  input, button { width:100%; font:inherit; padding:12px 14px; border-radius:8px; }
  input { border:1px solid var(--border); background:var(--bg); color:var(--text); margin-bottom:12px; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { border:0; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #err { color:var(--err); font-size:14px; min-height:1.5em; margin:10px 0 0; }
</style>
</head>
<body>
<form id="f">
  <svg class="logo" viewBox="0 0 1299 1500" aria-hidden="true"><path fill="var(--accent)" fill-rule="evenodd" d="M649 0 1299 375V1127L649 1500 0 1127V375ZM649 90 83 419V1081L649 1410 1215 1081V419Z"/><path fill="currentColor" d="M349 479H425V735L550 479H620L512 717L637 1021H564L459 766L425 829V1021H349ZM681 479H733L887 839V479H949V1021H902L745 651V1021H681Z"/></svg>
  <h1>Kalle Nutivaara</h1>
  <p>Diese Seite ist passwortgeschützt.</p>
  <label for="pw" style="position:absolute;left:-9999px">Passwort</label>
  <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" autofocus required>
  <button id="b" type="submit">Öffnen</button>
  <div id="err" role="alert"></div>
</form>
<script>
const DATA = __PAYLOAD__;
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:unb64(DATA.s), iterations:DATA.n, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(DATA.i) }, key, unb64(DATA.c));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
async function tryPw(pw, remember) {
  const html = await unlock(pw);
  if (remember) { try { sessionStorage.setItem('site-pw', pw); } catch (e) {} }
  show(html);
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  try { await tryPw(document.getElementById('pw').value, true); }
  catch (_) { err.textContent = 'Falsches Passwort.'; b.disabled = false; }
});
(async () => { let pw = null; try { pw = sessionStorage.getItem('site-pw'); } catch (e) {} if (pw) { try { await tryPw(pw, false); } catch (_) {} } })();
</script>
</body>
</html>
