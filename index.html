<style>
  :root { --ink:#0f0e27; --text:#eceef6; --muted:#a2a7bf; --ice:#9db8f2; --line:rgba(236,238,246,.18); --err:#ff8f8f; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:radial-gradient(120% 90% at 85% 10%, #2a2d4a 0, var(--ink) 60%); color:var(--text); font:16px/1.5 "Schibsted Grotesk",system-ui,sans-serif; }
  form { width:100%; max-width:360px; }
  .logo { display:block; width:40px; height:auto; margin-bottom:28px; }
  h1 { margin:0 0 6px; font-size:40px; font-weight:800; letter-spacing:-.04em; line-height:1; }
  p { margin:0 0 28px; color:var(--muted); }
  input, button { width:100%; font:inherit; padding:14px 16px; border-radius:999px; }
  input { border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text); margin-bottom:12px; }
  input::placeholder { color:var(--muted); }
  input:focus { outline:2px solid var(--ice); outline-offset:2px; }
  button { border:0; background:var(--text); color:var(--ink); font-weight:700; cursor:pointer; }
  button:hover { background:#fff; }
  button:disabled { opacity:.6; cursor:wait; }
  #err { color:var(--err); font-size:14px; min-height:1.5em; margin:12px 0 0; }
</style>
</head>

const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(pw) {

  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:unb64(DATA.s), iterations:DATA.n, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);

}
